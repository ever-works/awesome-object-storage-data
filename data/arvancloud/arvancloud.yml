markdown: >-
  ## Overview


  ArvanCloud provides S3-compatible object storage accessible through regional
  endpoints.


  ## Endpoint Format


  s3.<region>.arvanstorage.ir


  ## Addressing Style


  Virtual-hosted (bucket in subdomain).


  ## Pricing Model


  Paid service.
