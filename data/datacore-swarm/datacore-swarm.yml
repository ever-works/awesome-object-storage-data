markdown: >-
  ## Overview


  DataCore Swarm is a powerful software-defined storage solution for object
  storage workloads. It enables customers to leverage advanced data services
  while reducing costs across core, edge, and cloud storage environments.
  DataCore's solutions provide reliable data governance and storage management,
  ensuring always-on availability of data.


  ## Key Features


  - High Availability

  - Data Replication

  - S3 Compatibility

  - Data Protection

  - Access Control

  - Policy Based Management

  - Scalability

  - Data Encryption


  ## Target Segments


  - Startups

  - SMBs

  - Mid-Market

  - Enterprises


  ## Pricing


  Pricing information is not publicly listed; contact DataCore for a quote.


  ## Deployment


  Self-hosted, software-defined storage deployable on commodity hardware.
