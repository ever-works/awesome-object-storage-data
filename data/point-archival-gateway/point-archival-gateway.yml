name: PoINT Archival Gateway
description: PoINT Archival Gateway is a solution that integrates tape storage
  with Veeam Backup & Replication, providing cost-effective,
  ransomware-resistant, and eco-friendly on-premises data archiving. It offers
  true immutable storage and eliminates cloud-related transaction costs,
  supporting data integrity, deduplication, worm (write once read many),
  replication, and disaster recovery.
source_url: https://www.point.de
