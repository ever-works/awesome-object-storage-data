markdown: >-
  ## Overview


  PoINT Archival Gateway integrates tape storage with Veeam Backup & Replication
  for on-premises data archiving.


  ## Key Features


  - Data Integrity

  - Data Deduplication

  - Access Control

  - Replication

  - Snapshot Support

  - Data Migration

  - WORM (Write Once Read Many)

  - Disaster Recovery


  ## Target Segments


  StartUps, SMBs, Mid-Market, Enterprises


  ## Pricing Model


  Starting price information not publicly listed; contact vendor for pricing.


  ## Deployment


  Self-hosted / on-premises
