markdown: >-
  ## Overview


  Hitachi Content is a robust data management solution that unifies diverse
  storage resources, ensuring seamless data access, protection, and compliance.
  It simplifies hybrid cloud operations, enhances data resilience, and supports
  sustainable practices for mid-size enterprises.


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Key Features


  - Disaster Recovery

  - Content Sharing

  - Metadata Management

  - Replication

  - Access Control

  - Data Migration

  - Global Namespace

  - Data Tiering


  ## Pricing


  Starting Price: Not publicly listed. Contact Hitachi Vantara for pricing
  details.
