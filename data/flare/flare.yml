markdown: >-
  ## Overview


  Flare is a nonbloated, modern, and highly configurable file/screenshot vault
  server. It supports ShareX, Flameshot, and Spectacle clients, and offers OCR
  search functionality.


  ## Deployment


  Self-hosted via Docker. Built with Node.js.


  ## License


  MIT License. Source code available on GitHub.


  ## Features


  - File and screenshot vault server

  - ShareX, Flameshot, and Spectacle support

  - OCR search

  - Highly configurable

  - Docker deployment


  ## Pricing


  Free and open-source under the MIT license.
