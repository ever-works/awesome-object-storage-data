name: Huawei OBS
description: Huawei Object Storage Service (OBS) is a scalable, secure object
  storage service for storing unlimited amounts of unstructured data. It offers
  high reliability, lifecycle management, object lock, event notifications, and
  static website hosting with seamless integration into Huawei Cloud services.
