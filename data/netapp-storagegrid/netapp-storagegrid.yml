markdown: >-
  ## Overview


  NetApp StorageGRID is an enterprise-class, S3-compatible object storage
  solution that provides scalable, secure object storage for unstructured data
  across core, edge, and cloud environments.


  ## Key Features


  - Replication

  - Scalability

  - S3 Compatibility

  - Performance Monitoring

  - Data Integrity

  - Automated Tiering

  - Policy Driven Data Management

  - Data Encryption


  ## Target Segments


  - Startups

  - SMBs

  - Mid-Market

  - Enterprises


  ## Pricing


  Pricing information is not publicly listed; contact NetApp for a quote.


  ## Deployment


  Cloud and on-premises deployment options available.
