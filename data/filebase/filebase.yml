markdown: >-
  ## Overview


  Filebase provides S3-compatible object storage powered by blockchain
  infrastructure. It offers S3 API compatibility, making it suitable for
  developers and applications that require object storage with blockchain-based
  storage backend.


  ## Key Features


  - S3-compatible API

  - Blockchain-powered storage

  - Unlimited duration free tier


  ## Pricing


  Free plan includes 5 GB of storage for an unlimited duration.
