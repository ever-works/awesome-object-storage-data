markdown: >-
  ## Overview


  ZOT is a production-ready, vendor-neutral OCI-native container image registry.
  It provides a complete implementation of the OCI distribution specification
  for storing and distributing container images.


  ## Deployment


  Self-hosted. Built with Go, supports Docker deployment.


  ## License


  Apache-2.0 License. Source code available on GitHub.


  ## Features


  - OCI-native container image registry

  - Vendor-neutral

  - Production-ready

  - Go-based implementation

  - Docker support


  ## Pricing


  Free and open-source under the Apache-2.0 license.
