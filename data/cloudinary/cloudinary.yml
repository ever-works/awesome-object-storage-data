markdown: >-
  ## Overview


  Cloudinary provides image upload, manipulation, storage, and delivery for
  websites and applications with libraries for Ruby, Python, Java, PHP,
  Objective-C, and more.


  ## Features


  - Image upload and storage

  - Powerful image manipulations and transformations

  - CDN delivery

  - SDKs for multiple programming languages


  ## Pricing


  Freemium model. The free tier includes 25 monthly credits. One credit equals
  1,000 image transformations, 1 GB of storage, or 1 GB of CDN usage.
