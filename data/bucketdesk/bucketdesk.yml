name: BucketDesk
description: BucketDesk turns Amazon S3 buckets into a secure file workspace
  that teams can use without AWS console logins. Files stay in the user's own
  bucket and it connects through a scoped IAM role. Features include password
  protection, link sharing, link expiration, file preview, cost management, IAM
  integration, activity log, and role-based permissions.
