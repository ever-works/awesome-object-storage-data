markdown: >-
  ## Overview


  OneBlox is an innovative software solution that simplifies data management and
  storage, streamlining operations for businesses with a user-friendly interface
  and robust feature set.


  ## Key Features


  - Protocol Support

  - Data Tiering

  - Disaster Recovery

  - Automated Management

  - Global Deduplication

  - RESTful API

  - Audit Logging

  - Inline Compression


  ## Deployment


  OneBlox is deployed on-premises.


