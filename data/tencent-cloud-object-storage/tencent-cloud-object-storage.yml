markdown: >-
  ## Overview


  Tencent Cloud Object Storage (COS) is an S3-compatible cloud object storage
  service provided by Tencent Cloud for storing unstructured data.


  ## Features


  - S3 API compatibility

  - Scalable object storage

  - Cloud deployment

  - Integration with Tencent Cloud ecosystem


  ## Pricing


  Paid cloud service. Specific pricing details available on the official
  website.
