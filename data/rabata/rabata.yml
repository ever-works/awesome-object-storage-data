markdown: >-
  ## Overview


  Rabata is an S3-compatible object storage service providing full S3 API
  compatibility. It offers two storage tiers with a max object size of 5 TB.
  Backup plans are billed in 10 TB increments. No free egress allowance.


  ## Pricing


  Paid. Storage at $0.010/GB/mo. Egress at $0.01/GB with no free egress.


  ## Features


  - Full S3 compatibility

  - Two storage tiers

  - Max object size: 5 TB

  - Backup plans billed in 10 TB increments

  - No free egress


  ## Links


  - Website: <https://rabata.io>

  - S3 API docs: <https://rabata.io/docs/s3-api>
