markdown: >-
  ## Overview


  Red Hat Ceph Storage is an enterprise-grade, open-source storage platform
  based on Ceph. It delivers scalable, high-performance storage with integrated
  object, block, and file capabilities.


  ## Key Features


  - Seamless integration

  - Robust data protection

  - Cost-efficiency

  - Multi-environment support

  - Scalable architecture


  ## License


  Open source (Ceph is released under the GNU LGPL v2.1 license).


  ## Deployment


  Red Hat Ceph Storage can be deployed on-premises, in private clouds, and in
  hybrid environments.


  ## Pricing


  Pricing is subscription-based through Red Hat; contact Red Hat for details.
