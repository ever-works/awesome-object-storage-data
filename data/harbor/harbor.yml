markdown: >-
  ## Overview


  Harbor is an open source trusted cloud native registry project that stores,
  signs, and scans container images. It extends the open source Docker
  Distribution by adding functionalities such as security, identity, and
  management.


  ## Deployment


  Self-hosted via Docker and Kubernetes.


  ## License


  Apache-2.0 License. Source code available on GitHub.


  ## Features


  - Container image storage

  - Image signing and vulnerability scanning

  - Role-based access control

  - Image replication between registries

  - LDAP/AD integration

  - Docker and Kubernetes support


  ## Pricing


  Free and open-source under the Apache-2.0 license.
