markdown: >-
  ## Overview


  GarageHQ is a geo-distributed, S3-compatible storage service designed to
  fulfill many storage needs. It provides an S3-compatible interface for storing
  and retrieving objects across distributed nodes.


  ## Deployment


  Self-hosted via Docker. Built with Rust.


  ## License


  AGPL-3.0 License. Source code available on GitHub.


  ## Features


  - Geo-distributed storage

  - S3-compatible API

  - Docker deployment

  - Rust-based implementation


  ## Pricing


  Free and open-source under the AGPL-3.0 license.
