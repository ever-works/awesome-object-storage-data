  ## Overview


  Synology C2 Object Storage is an S3-compatible cloud object storage service
  offered by Synology for backup, archiving, and cloud storage use cases.


  ## Features


  - S3 API compatibility

  - Secure object storage

  - Backup and archiving support

  - Cloud deployment model

  - Synology ecosystem integration


  ## Pricing


  Paid cloud service. Specific pricing details available on the official
  website.
